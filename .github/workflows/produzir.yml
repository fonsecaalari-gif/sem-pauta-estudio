name: Produzir vídeos

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que produzir"
        type: choice
        options: [hoje, shorts, longo, tutorial, produto]
        default: hoje
      tema:
        description: "Tema (opcional; vazio = a Mistral escolhe pelas notícias do dia)"
        type: string
        required: false
      quadro:
        description: "Quadro do vídeo longo (vazio = o quadro do dia da semana)"
        type: choice
        options: ["do dia", pauta_da_semana, siga_o_dinheiro, sem_pauta_explica, checagem_da_semana, quem_votou, linha_do_tempo, resumo_da_semana]
        default: "do dia"
      quantos:
        description: "Quantos Shorts (ação 'shorts')"
        type: string
        default: "3"
      viral_url:
        description: "Link do post viral (série Sem Pauta Útil)"
        type: string
        required: false
      somente_roteiro:
        description: "Só gerar os roteiros, sem renderizar os vídeos"
        type: boolean
        default: false
  # Para gerar sozinho todo dia, apague o "#" das 2 linhas abaixo (horário em UTC: 09:17 UTC = 06:17 em Brasília).
  # schedule:
  #   - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Produzir
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          ACAO: ${{ inputs.acao || 'hoje' }}
          TEMA: ${{ inputs.tema }}
          QUADRO: ${{ inputs.quadro }}
          QUANTOS: ${{ inputs.quantos }}
          VIRAL_URL: ${{ inputs.viral_url }}
          SOMENTE_ROTEIRO: ${{ inputs.somente_roteiro }}
        run: |
          args=("$ACAO")
          [ -n "$TEMA" ] && args+=(--tema "$TEMA")
          [ -n "$QUADRO" ] && [ "$QUADRO" != "do dia" ] && [ "$ACAO" = "longo" ] && args+=(--quadro "$QUADRO")
          [ "$ACAO" = "shorts" ] && [ -n "$QUANTOS" ] && args+=(--quantos "$QUANTOS")
          [ -n "$VIRAL_URL" ] && args+=(--viral-url "$VIRAL_URL")
          [ "$SOMENTE_ROTEIRO" = "true" ] && args+=(--sem-render)
          python -m estudio "${args[@]}"

      - name: Resumo na página da execução
        if: always()
        run: |
          f=$(ls saida/*/RELATORIO.md 2>/dev/null | tail -1)
          [ -n "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || echo "Sem relatório." >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar vídeos para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sem-pauta-${{ github.run_number }}
          path: saida/
          retention-days: 14
          if-no-files-found: ignore

      - name: Salvar histórico (para não repetir temas)
        if: always()
        run: |
          git config user.name "sem-pauta-estudio"
          git config user.email "actions@users.noreply.github.com"
          git add kit/history.json
          git diff --cached --quiet || (git commit -m "Histórico de produção $(date +%F)" && git push)
